name: Deploy develop to Vercel

# Runs only after CI succeeded for a push to `develop`.
# The Vercel project is the DEVELOPMENT environment of this app.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-vercel-develop
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # Public domain of the development environment (repository/organization variable).
  DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}

jobs:
  deploy:
    name: Deploy to Vercel (development)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://${{ vars.DEV_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Point dev domain to this deployment
        if: ${{ vars.DEV_DOMAIN != '' }}
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" "$DEV_DOMAIN" --token=${{ secrets.VERCEL_TOKEN }} --scope="$VERCEL_ORG_ID"
          echo "Live: https://$DEV_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
